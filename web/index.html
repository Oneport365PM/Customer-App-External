<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#023819">
<title>OnePort 365 · Customer Portal (Web Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Nohemi (display) is used when installed on the viewer's device; falls back to Poppins. */
:root{
  --green:#023819; --green-2:#0a4a25; --light:#D1DBBD; --lime:#BFFB4F; --gold:#FFCC1A; --cream:#FDFBF1;
  --ink:#383838; --muted:#5f665b; --line:rgba(2,56,25,.1); --tint:#EDEFE8; --head-bg:#FAFAF4;
  --display:'Nohemi','Poppins',system-ui,sans-serif; --body:'Poppins',system-ui,sans-serif;
  --e1:0 1px 2px rgba(2,56,25,.05),0 1px 3px rgba(2,56,25,.04);
  --e3:0 4px 8px rgba(2,56,25,.06),0 18px 40px -16px rgba(2,56,25,.22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;color:inherit}
a{color:#2F7A3F}
.disp{font-family:var(--display);letter-spacing:-.01em}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid rgba(191,251,79,.95);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--green);color:var(--cream);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-family:var(--display);font-weight:700;font-size:19px;color:#fff;text-decoration:none}
.brand .mk{width:34px;height:34px;border-radius:10px;background:var(--lime);display:grid;place-items:center;flex:none}
.brand b{color:var(--lime);font-weight:700}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(209,219,189,.65);padding:16px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--light);text-decoration:none;font-weight:500;font-size:14.5px;margin-bottom:2px}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--lime);color:var(--green);font-weight:600}
.nav a.on svg{stroke:var(--green)}
.nav .badge{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:10px;background:rgba(191,251,79,.18);color:var(--lime);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.nav a.on .badge{background:var(--green);color:var(--lime)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.12)}
.me .av{width:36px;height:36px;border-radius:50%;background:#E4EDE2;color:var(--green);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.me .nm{font-size:13.5px;font-weight:600;color:#fff;line-height:1.3}
.me .co{font-size:12px;color:var(--light)}
.me .out{margin-left:auto;width:36px;height:36px;border-radius:9px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer}
.me .out:hover{background:rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;display:flex;align-items:center;gap:12px;padding:0 32px;border-bottom:1px solid var(--line);background:rgba(253,251,241,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.search input{border:none;outline:none;background:transparent;font:inherit;flex:1;color:var(--ink)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative}
.iconbtn:hover{border-color:rgba(2,56,25,.3)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid #fff}
.content{padding:28px 32px 56px;max-width:1280px;width:100%}

/* ---------- page bits ---------- */
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;gap:6px;align-items:center}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:500}
.crumbs a:hover{color:var(--green);text-decoration:underline}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.2;color:var(--green);margin:0}
.ph p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--e1)}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-h h2{font-family:var(--display);font-weight:600;font-size:17px;color:var(--green);margin:0}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.card-b{padding:18px 20px}
.card-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.aside{position:sticky;top:88px;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;white-space:nowrap}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{background:#FFF3CC;color:#7a5d00}.st-pending::before{background:#E0A800!important}
.st-accepted{background:#E1F1E8;color:#0f7a45}.st-accepted::before{background:#1F8A5B!important}
.st-rejected{background:var(--tint);color:#4a5a3f}.st-rejected::before{background:#808080!important}
.svc{width:36px;height:36px;border-radius:10px;background:var(--tint);display:grid;place-items:center;flex:none}
.svc.sm{width:28px;height:28px;border-radius:8px}
.btn{height:44px;padding:0 18px;border-radius:8px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:none;transition:background .16s;white-space:nowrap;text-decoration:none}
.btn.block{width:100%;height:48px}
.btn-accent{background:var(--lime);color:var(--green)}.btn-accent:hover{background:#a9e83a}
.btn-solid{background:var(--green);color:var(--cream)}.btn-solid:hover{background:var(--green-2)}
.btn-outline{background:#fff;color:var(--green);border:1.5px solid var(--green)}.btn-outline:hover{background:#f4f6ef}
.btn-ghost{background:transparent;color:var(--green)}.btn-ghost:hover{background:rgba(2,56,25,.06)}
.btn-disabled{background:#8FA08B;color:#F4F6EF;cursor:not-allowed}
.btn-sm{height:36px;padding:0 14px;font-size:13.5px}
.link{all:unset;cursor:pointer;color:#2F7A3F;font-weight:600;font-size:13.5px}
.link:hover{text-decoration:underline}
.link:focus-visible{outline:2px solid var(--green)}
.banner{margin:0;font-size:14px;line-height:1.55;border-radius:12px;padding:14px 16px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.kv .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kv .v{font-size:14.5px;font-weight:500;color:var(--green);word-break:break-word}
.kv.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.kv .full{grid-column:1/-1}
.prog{display:block;height:6px;border-radius:3px;background:var(--tint);overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;border-radius:3px;background:var(--green)}
.prog.done i{background:#1F8A5B}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 16px;background:var(--head-bg);border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data tr:last-child td{border-bottom:none}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:#FBFCF7}
tr.rowlink:focus-visible{outline:3px solid var(--lime);outline-offset:-3px}
.idlink{font-weight:600;color:var(--green);text-decoration:none}
.idlink:hover{text-decoration:underline}
.r{text-align:right}
.amts{text-align:right;line-height:1.35;display:inline-block}
.amts .a1{display:block;font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--green);white-space:nowrap}
.amts .a2{display:block;font-size:12.5px;font-weight:600;color:var(--green);white-space:nowrap}
.cur{font-size:.55em;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:.02em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tab:hover{color:var(--green)}
.tab.on{color:var(--green);border-bottom-color:var(--green)}
.tab em{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--tint);color:#4a5a3f;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.tab.on em{background:var(--lime);color:var(--green)}
.tab:focus-visible{outline:3px solid var(--lime)}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--e1);transition:border-color .16s,box-shadow .16s}
.kpi:hover{border-color:rgba(2,56,25,.3);box-shadow:var(--e3)}
.kpi:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.kpi .lb{font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .n{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;color:var(--green)}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hot{background:var(--green);border-color:var(--green)}
.kpi.hot .lb,.kpi.hot .s{color:var(--light)}
.kpi.hot .n{color:var(--lime)}
.kpi .m1{font-family:var(--display);font-weight:600;font-size:22px;color:var(--green);line-height:1.2}
.kpi .m2{font-family:var(--display);font-weight:600;font-size:15px;color:var(--green)}
.task{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task .ti{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.task .tt{font-weight:600;color:var(--green);font-size:14px}
.task .ts{font-size:12.5px;color:var(--muted);margin-top:1px}

/* ---------- quote / invoice detail ---------- */
.sec{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.grp{background:#FFF8E0;color:#7a5d00;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:10px 16px;display:flex;justify-content:space-between}
table.lines{width:100%;border-collapse:collapse}
table.lines th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
table.lines td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
table.lines td.desc{font-weight:500;color:var(--green)}
table.lines td.amt{text-align:right;font-weight:600;color:var(--green);white-space:nowrap;font-variant-numeric:tabular-nums}
table.lines tr.subrow td{border-bottom:none;color:var(--muted);font-size:13px;text-align:right}
table.lines tr.subrow b{color:var(--green)}
.grand{display:flex;justify-content:space-between;align-items:center;background:var(--green);color:var(--cream);border-radius:12px;padding:16px 20px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.grand b{font-family:var(--display);font-size:19px;color:#fff;letter-spacing:0;text-transform:none;text-align:right;line-height:1.4}
.curnote{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.5;color:var(--muted)}
.notice{margin:12px 0 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.notice b{color:#7a5d00}
details.acc{border-top:1px solid var(--line)}
details.acc:first-child{border-top:none}
details.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-weight:600;color:var(--green)}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary svg{transition:transform .2s}
details.acc[open] summary svg{transform:rotate(180deg)}
details.acc .in{padding:0 20px 16px;color:var(--muted);font-size:13.5px;line-height:1.6}
.terms{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.row span:first-child{color:var(--muted)}
.row span:last-child{color:var(--green);font-weight:500;text-align:right}
.bigamt{font-family:var(--display);font-weight:700;color:var(--green);line-height:1.2}

/* ---------- shipments ---------- */
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 4px 4px}
.step{position:relative;text-align:center;padding:0 6px}
.step .sd{width:32px;height:32px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;border:2px solid rgba(2,56,25,.25);background:#fff;position:relative;z-index:1}
.step::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:#DBE3DE}
.step:first-child::before{display:none}
.step.is-done::before,.step.current::before{background:var(--green)}
.step.is-done .sd{background:var(--green);border-color:var(--green)}
.step.current .sd{background:var(--lime);border-color:var(--green)}
.step.current .sd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--green)}
.step .sl{font-weight:600;font-size:13.5px;color:var(--muted)}
.step.is-done .sl,.step.current .sl{color:var(--green)}
.step .sm{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.step .sdt{font-size:12px;font-weight:600;color:var(--green);margin-top:4px}
.update{margin:12px 0 0;padding:12px 14px;border-radius:10px;background:#F4F6EF;font-size:13.5px;line-height:1.55}
.doc{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:none}
.doc .fi{width:36px;height:36px;border-radius:9px;background:var(--tint);display:grid;place-items:center;flex:none}
.doc .fi.need{background:#FFF3CC}
.doc .dn{font-weight:600;color:var(--green)}
.doc .dm{font-size:12.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subhead{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:14px 20px 4px}

/* ---------- account ---------- */
.ident{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.ident .nm{font-family:var(--display);font-weight:600;font-size:19px;color:var(--green);line-height:1.25}
.mono{width:46px;height:46px;border-radius:10px;background:#E4EDE2;color:var(--green);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
.mono.round{border-radius:50%}
.mono.xs{width:22px;height:22px;font-size:9.5px;border-radius:50%}
.tier{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:6px;border:1px solid rgba(2,56,25,.25);background:var(--tint);color:var(--green)}
.v-row{display:flex;align-items:center;gap:6px}
.pref{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line)}
.pref:last-child{border-bottom:none}
.switch{all:unset;cursor:pointer;width:46px;height:28px;border-radius:14px;background:#C9D0C3;position:relative;flex:none;transition:background .18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--lime)}
.switch:focus-visible{outline:3px solid var(--lime);outline-offset:2px}

/* ---------- forms ---------- */
.field{position:relative;display:block;border-radius:8px;padding:14px 14px 12px;border:1.5px solid rgba(2,56,25,.35);background:#fff}
.field:hover{border-color:rgba(2,56,25,.6)}
.field.filled{border-color:var(--green)}
.field:focus-within{border:2px solid var(--green);padding:13.5px 13.5px 11.5px}
.field.error,.field.error:focus-within{border:2px solid #FF1A1A;padding:13.5px 13.5px 11.5px}
.flabel{position:absolute;top:-9px;left:11px;background:#fff;padding:0 5px;font-size:12px;font-weight:500;color:var(--muted)}
.field.filled .flabel,.field:focus-within .flabel{color:var(--green)}
.field.error .flabel{color:#cc1414}
.inp{display:block;width:100%;border:none;outline:none;padding:0;font-family:var(--body);font-size:15px;color:var(--ink);background:transparent}
.field textarea{display:block;width:100%;border:none;outline:none;resize:vertical;font-family:var(--body);font-size:15px;line-height:1.5;color:var(--ink);background:transparent;min-height:110px;padding:0}
.ferr{font-size:12.5px;color:#cc1414;font-weight:500;margin-top:5px}
.k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rchip{height:36px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--green);border:1px solid rgba(2,56,25,.22)}
.rchip.on{background:var(--green);color:var(--lime);border-color:var(--green)}
.dropzone{all:unset;box-sizing:border-box;width:100%;cursor:pointer;border:1.5px dashed rgba(2,56,25,.35);border-radius:12px;padding:22px;display:flex;align-items:center;gap:14px;background:#FBFCF8;transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.over{border-color:var(--green);background:#F4F8EC}
.dropzone.has{border-style:solid;border-color:var(--green);background:#fff}
.dropzone:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:none;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.pw-toggle:hover{background:rgba(2,56,25,.06)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin:0;accent-color:var(--green)}
.formerr{background:#FDE0E0;color:#8f1010;border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.5}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(2,56,25,.25);border-top-color:var(--green);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-brand{background:var(--green);color:var(--cream);padding:48px 56px;display:flex;flex-direction:column}
.auth-brand h1{font-family:var(--display);font-weight:600;font-size:44px;line-height:1.1;letter-spacing:-.02em;color:#fff;margin:auto 0 18px;max-width:520px}
.auth-brand h1 span{background:var(--lime);color:var(--green);padding:0 10px;border-radius:8px}
.auth-brand p{color:var(--light);font-size:16px;line-height:1.6;max-width:460px;margin:0 0 32px}
.feat{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;max-width:460px}
.feat .fi{width:40px;height:40px;border-radius:11px;background:rgba(191,251,79,.14);display:grid;place-items:center;flex:none}
.feat b{display:block;color:#fff;font-weight:600}
.feat span{color:var(--light);font-size:13.5px;line-height:1.5}
.auth-brand .foot{margin-top:auto;padding-top:32px;font-size:12.5px;color:rgba(209,219,189,.7)}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.auth-card h2{font-family:var(--display);font-weight:600;font-size:28px;color:var(--green);margin:0}

/* ---------- modal + toast ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(1,28,12,.5);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s ease}
.dialog{background:#fff;border-radius:16px;width:min(540px,100%);max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:0 30px 80px -20px rgba(1,28,12,.5);animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.dialog .dh{padding:22px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dialog .dh h2{font-family:var(--display);font-weight:600;font-size:22px;color:var(--green);margin:0}
.dialog .dh p{margin:6px 0 0;color:var(--muted);font-size:14.5px;line-height:1.55}
.dialog .db{padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.dialog .df{padding:16px 24px 22px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}
.closebtn{width:36px;height:36px;border:none;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:none}
.closebtn:hover{background:rgba(2,56,25,.06)}
.done-ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:4px auto 0}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.toasts{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:10px;background:var(--green);color:var(--cream);border-radius:12px;padding:13px 16px;font-size:14px;font-weight:500;box-shadow:var(--e3);animation:pop .2s ease;max-width:380px}

/* ---------- responsive ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}.aside{position:static}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:8px;z-index:20;overflow-x:auto}
  .brand{padding:0 6px 0 0}.brand span.txt{display:none}
  .nav-label,.me .nm,.me .co,.me .av{display:none}
  .nav{display:flex;gap:4px}.nav a{height:38px;white-space:nowrap}
  .me{margin:0 0 0 auto;border:none;padding:0}
  .topbar{display:none}
  .content{padding:20px 16px 48px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .auth{grid-template-columns:minmax(0,1fr)}.auth-brand{padding:28px 24px}.auth-brand h1{font-size:30px;margin-top:24px}.auth-brand .feat,.auth-brand .foot{display:none}
  .stepper{grid-template-columns:minmax(0,1fr);gap:4px}.step{text-align:left;display:grid;grid-template-columns:32px 1fr;column-gap:12px;padding:0}.step::before{display:none}.step .sd{margin:0;grid-row:span 3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function render() {

  if (!S.auth) { root.innerHTML = loginScreen(); }

    var page = ({ dashboard: dashboard, shipments: shipmentsPage, quotes: quotesPage, invoices: invoicesPage, account: accountPage })[S.page]();
    root.innerHTML = shell(page) + modalHTML();
    document.title = (S.detail ? S.detail + ' · ' : '') + S.page.charAt(0).toUpperCase() + S.page.slice(1) + ' · OnePort 365';
  }
  if (S.modal && S.modal.justOpened) {
    S.modal.justOpened = false;
    setTimeout(function () { var f = root.querySelector('.dialog textarea, .dialog input, .dialog [data-act="confirmAccept"], .dialog .btn-solid'); if (f) f.focus(); }, 30);
  } else if (active) { var el = document.getElementById(active); if (el) { el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } }

function toast(msg) {
  var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = svg(P.check, 16, '#BFFB4F', 2.6) + '<span>' + esc(msg) + '</span>';
  document.getElementById('toasts').appendChild(t); setTimeout(function () { t.remove(); }, 3200);

function openModal(type, extra) { S.modal = Object.assign({ type: type, justOpened: true }, extra || {}); render(); }
function syncReject() {
  var m = S.modal, filled = (m.reason || '').trim().length > 0, f = document.getElementById('rfield'); if (!f) return;
  f.className = 'field' + (filled ? ' filled' : '') + (m.err ? ' error' : '');

function setFile(f) {

    setTimeout(function () {
      L.busy = false;
      if (L.pw.toLowerCase() === 'wrongpass') { L.formErr = 'The email or password is incorrect. Try again or reset your password.'; L.pw = ''; render(); return; }
      S.auth = true; parse(); render(); toast('Welcome back, ' + S.contact.name.split(' ')[0]);
    }, 900);
    return;
  }
  var key = f.getAttribute('data-form');
  if (key && EDIT[key]) {
    e.preventDefault();
    var ed = EDIT[key], vals = {}, errs = {};
    ed.fields.forEach(function (fl) {
      var val = document.getElementById('ed-' + fl[0]).value.trim(); vals[fl[0]] = val;
      if (fl[2] && !val) errs[fl[0]] = fl[1] + ' is required.';
      else if (fl[0] === 'email' && val && !validEmail(val)) errs[fl[0]] = 'Enter a valid email address.';
    });
    if (Object.keys(errs).length) { S.modal.vals = Object.assign({}, S[ed.obj], vals); S.modal.errs = errs; render(); return; }
    Object.assign(S[ed.obj], vals); S.modal = null; render(); toast(ed.obj === 'company' ? 'Company details updated' : 'Contact details updated');
  }
});

render();
})();
</script>
</body>
</html>
