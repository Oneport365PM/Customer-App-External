<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FDFBF1">
<title>OnePort 365 · Customer App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Nohemi is not on Google Fonts. It is used if installed on the viewer's device; to embed it, add
   @font-face{font-family:'Nohemi';src:url(Nohemi-SemiBold.woff2) format('woff2');font-weight:600}
   (and 400/700) here. Falls back to Poppins. */
:root{
  --green:#023819; --light:#D1DBBD; --lime:#BFFB4F; --gold:#FFCC1A; --cream:#FDFBF1;
  --ink:#383838; --muted:#5f665b; --line:rgba(2,56,25,.1); --tint:#EDEFE8;
  --display:'Nohemi','Poppins',system-ui,sans-serif; --body:'Poppins',system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0b2a17;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.disp{font-family:var(--display);letter-spacing:-.01em}
.muted{color:var(--muted)}
:focus-visible{outline:3px solid rgba(191,251,79,.9);outline-offset:2px}

/* ---------- stage ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding:32px 24px}
.intro{max-width:300px;color:var(--cream)}
.intro .brand{font-family:var(--display);font-weight:700;font-size:18px}
.intro .brand b{color:var(--lime)}
.intro h1{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.15;letter-spacing:-.02em;margin:20px 0 12px}
.intro p{color:var(--light);font-size:15px;line-height:1.6;margin:0 0 24px}
.restart{height:44px;padding:0 18px;border-radius:8px;border:1.5px solid rgba(253,251,241,.4);background:transparent;color:var(--cream);font-weight:600;font-size:14px;cursor:pointer}
.restart:hover{background:rgba(255,255,255,.08)}
.phone{width:390px;height:844px;border-radius:44px;padding:10px;background:#111;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);flex-shrink:0}
.app{position:relative;width:100%;height:100%;overflow:hidden;border-radius:34px;background:var(--cream)}
@media (max-width:860px){.intro{display:none}}
@media (max-width:500px){
  body{background:var(--cream)}
  .stage{padding:0;display:block;height:100%}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;background:none;box-shadow:none}
  .app{border-radius:0}
}
@media (min-width:501px) and (max-height:880px){.phone{transform:scale(calc(100vh / 900))}}

/* ---------- shared ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;white-space:nowrap}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pending{background:#FFF3CC;color:#7a5d00}.st-pending::before{background:#E0A800!important}
.st-accepted{background:#E1F1E8;color:#0f7a45}.st-accepted::before{background:#1F8A5B!important}
.st-rejected{background:var(--tint);color:#4a5a3f}.st-rejected::before{background:#808080!important}
.btn{height:52px;width:100%;border-radius:8px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:background .16s}
.btn-accent{background:var(--lime);color:var(--green)}.btn-accent:hover{background:#a9e83a}
.btn-solid{background:var(--green);color:var(--cream)}.btn-solid:hover{background:#0a4a25}
.btn-outline{background:#fff;color:var(--green);border:1.5px solid var(--green)}.btn-outline:hover{background:#f4f6ef}
.btn-text{background:transparent;color:var(--green);height:44px;font-size:14px}
.btn-disabled{background:#8FA08B;color:#F4F6EF;cursor:not-allowed}
.icon-btn{width:44px;height:44px;border-radius:10px;border:none;background:transparent;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:rgba(2,56,25,.06)}
h2.sec{font-family:var(--display);font-weight:600;font-size:16px;color:var(--green);margin:0 0 12px}
.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.row span:first-child{color:var(--muted)}
.row span:last-child{color:var(--green);font-weight:500;text-align:right}
.svc{width:38px;height:38px;border-radius:10px;background:var(--tint);display:grid;place-items:center;flex-shrink:0}
.head{flex-shrink:0;padding:20px 20px 8px;display:flex;align-items:center;justify-content:space-between;min-height:76px}
.head h1{font-family:var(--display);font-weight:600;font-size:28px;color:var(--green);margin:0}
.bar{flex-shrink:0;padding:8px 10px;display:flex;align-items:center;gap:4px}
.filters{flex-shrink:0;display:flex;gap:8px;padding:8px 20px 12px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--green);border:1px solid rgba(2,56,25,.18)}
.filter.on{background:var(--lime);border-color:var(--lime)}
.list{padding:0 20px 20px;display:flex;flex-direction:column;gap:10px}
.tapcard{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px;transition:border-color .16s}
.tapcard:hover{border-color:rgba(2,56,25,.3)}
.tapcard:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.tabbar{flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(14px + var(--safe-b));display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted);position:relative;padding:2px 0}
.tab.on{color:var(--green);font-weight:600}
.tab .ic{height:28px;padding:0 16px;border-radius:999px;display:grid;place-items:center}
.tab.on .ic{background:var(--lime)}
.tab .count{position:absolute;top:-4px;left:50%;margin-left:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--green);color:var(--lime);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.toast{position:absolute;left:16px;right:16px;bottom:calc(92px + var(--safe-b));z-index:40;display:flex;align-items:center;gap:10px;background:var(--green);color:var(--cream);border-radius:12px;padding:13px 14px;font-size:14px;font-weight:500;box-shadow:0 20px 45px -22px rgba(2,56,25,.8);animation:rise .22s ease}
.toast[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* ---------- quote detail ---------- */
.actions{flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(18px + var(--safe-b));display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions.one{grid-template-columns:1fr}
.grp{background:#FFF8E0;color:#7a5d00;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px}
.line{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.amt{font-size:14px;font-weight:600;color:var(--green);white-space:nowrap;font-variant-numeric:tabular-nums}
.subt{display:flex;justify-content:flex-end;gap:8px;padding:10px 0 12px;font-size:13px;color:var(--muted)}
.subt b{color:var(--green);font-weight:600}
.grand{display:flex;justify-content:space-between;align-items:center;background:var(--green);color:var(--cream);border-radius:12px;padding:16px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.grand b{font-size:18px;color:#fff;letter-spacing:0;text-transform:none}
.notice{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.notice b{color:#7a5d00}
.terms{margin:0 0 14px;padding-left:20px;font-size:13px;line-height:1.55;color:var(--muted);display:flex;flex-direction:column;gap:6px}
details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-size:14px;font-weight:500;color:var(--green)}
summary::-webkit-details-marker{display:none}
summary svg{transition:transform .2s}
details[open] summary svg{transform:rotate(180deg)}
.banner{margin:0;font-size:14px;line-height:1.5;border-radius:10px;padding:12px 14px}

/* ---------- shipments ---------- */
.prog{display:block;height:6px;border-radius:3px;background:var(--tint);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;border-radius:3px;background:var(--green)}
.prog.done i{background:#1F8A5B}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:14px}
.tl .rail{display:flex;flex-direction:column;align-items:center;width:24px;flex:none}
.tl .node{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(2,56,25,.25);background:#fff;flex:none}
.tl .is-done .node{background:var(--green);border-color:var(--green)}
.tl .current .node{background:var(--lime);border-color:var(--green)}
.tl .current .node::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.tl .seg{width:2px;flex:1;min-height:20px;background:#DBE3DE}
.tl .is-done .seg{background:var(--green)}
.tl .body{flex:1;min-width:0;padding:2px 0 18px;display:flex;justify-content:space-between;gap:8px}
.tl li:last-child .body{padding-bottom:0}
.tl .label{font-weight:600;font-size:14px;color:var(--muted)}
.tl .is-done .label,.tl .current .label{color:var(--green)}
.update{margin:12px 0 0;padding:12px;border-radius:8px;background:#F4F6EF;font-size:13px;line-height:1.5;color:var(--ink)}

/* ---------- account ---------- */
.menu{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mrow{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);font-size:15px;font-weight:500;color:var(--green)}
.mrow:last-child{border-bottom:none}
.mrow:hover{background:#FBFCF8}
.mrow:focus-visible{outline:3px solid var(--lime);outline-offset:-3px}
.mrow .mi{width:34px;height:34px;border-radius:9px;background:var(--tint);display:grid;place-items:center;flex:none}
.switch{all:unset;cursor:pointer;width:46px;height:28px;border-radius:14px;background:#C9D0C3;position:relative;flex:none;transition:background .18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--lime)}
.switch:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.avatar{width:56px;height:56px;border-radius:14px;background:var(--green);color:var(--lime);font-family:var(--display);font-weight:600;font-size:19px;display:grid;place-items:center;flex:none}

/* ---------- home ---------- */
.wordmark{font-family:var(--display);font-weight:700;font-size:20px;color:var(--green)}
.wordmark b{color:#2F7A3F}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;gap:6px;transition:border-color .16s}
.stat:hover{border-color:rgba(2,56,25,.3)}
.stat:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.stat b{font-family:var(--display);font-weight:600;font-size:28px;line-height:1;color:var(--green)}
.stat span{font-size:12px;font-weight:500;color:var(--muted);line-height:1.3}
.stat.hot{background:var(--green);border-color:var(--green)}
.stat.hot b{color:var(--lime)}.stat.hot span{color:var(--light)}
.sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sechead h2{font-family:var(--display);font-weight:600;font-size:17px;color:var(--green);margin:0}
.link{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:#2F7A3F;padding:8px 0}
.link:focus-visible{outline:2px solid var(--green)}

/* ---------- account panels ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-h{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.panel-h h2{font-family:var(--display);font-weight:600;font-size:17px;color:var(--green);margin:0}
.panel-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.panel-b{padding:16px}
.panel-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.ident{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ident .nm{font-family:var(--display);font-weight:600;font-size:18px;color:var(--green);line-height:1.25}
.mono{width:44px;height:44px;border-radius:10px;background:#E4EDE2;color:var(--green);font-weight:700;font-size:14px;display:grid;place-items:center;flex:none}
.mono.round{border-radius:50%}
.mono.xs{width:22px;height:22px;font-size:9.5px;border-radius:50%}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kgrid .full{grid-column:1/-1}
.k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.v{font-size:14px;color:var(--ink);word-break:break-word;display:flex;align-items:center;gap:6px}
.v a{color:#2F7A3F;text-decoration:none;font-weight:500}
.tier{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:6px;border:1px solid rgba(2,56,25,.25);background:#EDEFE8;color:var(--green)}
.btn-sm{height:40px;width:auto;padding:0 16px;font-size:14px;gap:8px}

/* ---------- documents ---------- */
.doc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:none}
.doc .fi{width:36px;height:36px;border-radius:9px;background:var(--tint);display:grid;place-items:center;flex:none}
.doc .fi.need{background:#FFF3CC}
.doc .dn{font-size:14px;font-weight:600;color:var(--green)}
.doc .dm{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subhead{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 0 2px}
.dropzone{all:unset;box-sizing:border-box;width:100%;cursor:pointer;border:1.5px dashed rgba(2,56,25,.35);border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;background:#FBFCF8}
.dropzone:hover{border-color:var(--green)}
.dropzone.has{border-style:solid;border-color:var(--green);background:#fff}
.dropzone:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.rchip{height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--green);border:1px solid rgba(2,56,25,.22)}
.rchip.on{background:var(--green);color:var(--lime);border-color:var(--green)}
.inp{display:block;width:100%;border:none;outline:none;padding:0;font-family:var(--body);font-size:15px;color:var(--ink);background:transparent}
.field.compact{padding:14px 14px 12px}
.field.compact:focus-within{padding:13.5px 13.5px 11.5px}
.ferr{font-size:12px;color:#cc1414;font-weight:500;margin-top:4px;min-height:0}
.sheet.tall{max-height:92%;overflow-y:auto}

/* ---------- sheets ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;border:none;padding:0;background:rgba(1,28,12,.5);cursor:pointer}
.sheet{position:relative;background:#fff;border-radius:20px 20px 0 0;padding:12px 20px calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:16px}
.anim .scrim{animation:fade .2s ease}.anim .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
.handle{width:40px;height:4px;border-radius:2px;background:var(--light);margin:0 auto}
.field{position:relative;display:block;border-radius:8px;padding:16px 14px 12px;border:1.5px solid rgba(2,56,25,.35)}
.field.filled{border-color:var(--green)}
.field:focus-within{border:2px solid var(--green);padding:15.5px 13.5px 11.5px}
.field.error,.field.error:focus-within{border:2px solid #FF1A1A;padding:15.5px 13.5px 11.5px}
.flabel{position:absolute;top:-9px;left:11px;background:#fff;padding:0 5px;font-size:12px;font-weight:500;color:var(--muted)}
.field.filled .flabel,.field:focus-within .flabel{color:var(--green)}
.field.error .flabel{color:#cc1414}
.field textarea{display:block;border:none;outline:none;width:100%;resize:none;font-family:var(--body);font-size:15px;line-height:1.5;color:var(--ink);background:transparent;min-height:110px;padding:0}
.field textarea::placeholder{color:#8a8f86}

/* ---------- done ---------- */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 28px;gap:14px}
.done-ic{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.foot{flex-shrink:0;padding:12px 20px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <aside class="intro" aria-label="About this prototype">
    <div class="brand">OnePort<b>&nbsp;365</b></div>
    <h1>Customer app prototype</h1>
    <p>See what needs your attention, decide on quotes, track shipments, send documents and manage your account. Accepting a quote creates a shipment you can follow. Everything on the phone is clickable.</p>
    <button class="restart" type="button" data-act="restart">Restart demo</button>
  </aside>
  <div class="phone"><div class="app"><div id="app" style="position:absolute;inset:0"></div><div class="toast" id="toast" role="status" hidden></div><input type="file" id="filepick" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx" hidden></div></div>
</div>

<script>
(function () {

var TERMS = [
  'All documents related to clearing shipments is to be provided by the CLIENT where we do not handle documentation.',

  'The Goods imported are the same as the Goods declared on all Documents provided.',
  'CLIENT to ensure timely payment of Duty.',
  'CLIENT to offload SERVICE PROVIDER’s Trucks within 24Hrs of arrival at Facility, Truck demurrage per day applies for delays @₦30,000.',
  'CLIENT to provide Delivery address accurately on the DATASHEET.',
  'Any force majeure, incident or accident will be notified to Client and necessary solutions will be provided.',
  'Counter for number of days shall halt where we have to resolve queries or incomplete documentation.',
  'For NAFDAC regulated items, Client to provide samples within 24 hrs of discharge of cargo at warehouse for submission to NAFDAC for 2nd stamping to effect full release.',
  'Client to ensure quantities supplied as samples fit item of import & batch number as per the NAFDAC requirements.',
  'Client to ensure all documentation regarding NAFDAC certificates, current year import permits and applicable HS codes are valid as per the standard import guidelines requirements.',
  'For chemicals requiring EUC certificates, Client to ensure provision of certificates ahead of customs clearing.',
  'All shipments from China and India must be accompanied by laboratory stamped CRIA.'
];
var NOTICE = 'Duty and tax advised are subject to verification and assessment by NCS upon arrival of cargo. 7.5% VAT will be applicable at the time of invoicing. Storage / detention / demurrage charges (if any) are as per receipted.';

var SERVICE_ICON = { ocean: 'ship', air: 'plane', customs: 'stamp' };

var QUOTES = [
  { id: 'Q-26-11-024', status: 'pending', svc: 'ocean', service: 'Ocean Freight FCL',
    from: 'Shanghai, China', to: 'Apapa, Lagos', route: 'CNSHA → NGAPP', date: '09 Nov 2026', validUntil: '16 Nov 2026',
    details: [['Service', 'Ocean Freight FCL'], ['Route', 'CNSHA → NGAPP'], ['Container', '40FT × 2'], ['Class', 'FAK']],
    sections: [
      ['Haulage', [
        ['APMT, Apapa Road, Lagos → Ikeja, Lagos', 'Unit 1 · Qty 2 · Per Container', 460000],
        ['APMT, Apapa Road, Lagos → Ikeja, Lagos · 1×40FT', 'Unit 2 · Qty 2 · Per Truck', 690000]
      ]],
      ['Other charges', [
        ['Customs Brokerage', 'Unit 2 · Qty 2 · Per Container', 120000]
      ]]
    ],

        }).join('') + '<div class="subt"><span>Sub total</span><b>' + money(subtotal(sec)) + '</b></div></div></div>';
    }).join('') + '<div class="grand"><span>Grand total</span><b class="disp">' + money(t) + ' NGN</b></div></div></section>';
  h += '<p class="notice"><b>Important notice.</b> ' + esc(NOTICE) + '</p>';

  return h + '</section>';
}

function syncReject() {

  document.getElementById('reason').setAttribute('aria-invalid', S.err ? 'true' : 'false');
  document.getElementById('helper').textContent = S.err ? 'Please enter a reason before submitting.' : '';

function shipDetail() {

  }).join('');

      '<div class="card" style="padding:16px;margin-top:6px"><div style="font-size:13px" class="muted">' + etaLabel + '</div><div class="disp" style="font-weight:700;font-size:24px;color:#023819;line-height:1.25">' + s.eta + '</div>' +
      (s.update ? '<p class="update">' + esc(s.update) + '</p>' : '') + '</div></div>' +

    docsSection(s) +
    '<section><h2 class="sec">Details</h2><div class="card" style="padding:2px 16px">' + facts.map(function (f) { return '<div class="row"><span>' + f[0] + '</span><span>' + esc(f[1]) + '</span></div>'; }).join('') + '</div></section>' +
    '<button type="button" class="btn btn-outline" data-act="toast" data-v="Opening chat with Gift, your account manager">' + svg(P.chat, 18, '#023819', 2) + '<span style="margin-left:8px">Contact your account manager</span></button>' +
    '</div></div></section>';

function accountPage() {
  var k = S.page, body = '';
  if (k === 'notifications') {
    body = '<div class="menu">' + NOTIF.map(function (n) {
      return '<div class="mrow" style="cursor:default"><span style="flex:1;min-width:0"><span id="lb-' + n[0] + '" style="display:block;font-size:15px">' + n[1] + '</span><span class="muted" style="display:block;font-size:12.5px;font-weight:400;margin-top:2px">' + esc(n[2]) + '</span></span>' +
        '<button type="button" class="switch" role="switch" aria-labelledby="lb-' + n[0] + '" aria-checked="' + !!S.prefs[n[0]] + '" data-act="pref" data-v="' + n[0] + '"></button></div>';
    }).join('') + '</div>';
  } else if (k === 'addresses') {
    body = '<div class="menu">' + ADDRESSES.map(function (a) {
      return '<div class="mrow" style="cursor:default;align-items:flex-start"><span class="mi">' + svg(P.pin, 18, '#023819', 1.9) + '</span><span style="flex:1;min-width:0"><span style="display:block;font-size:15px">' + a[0] + '</span><span class="muted" style="display:block;font-size:13px;font-weight:400;margin-top:2px;line-height:1.45">' + esc(a[1]) + '</span>' +
        (a[2] ? '<span class="chip" style="background:#EDEFE8;color:#4a5a3f;margin-top:8px">' + a[2] + '</span>' : '') + '</span></div>';
    }).join('') + '</div>' +
      '<button type="button" class="btn btn-outline" data-act="toast" data-v="Add address isn’t part of this prototype">' + svg(P.plus, 18, '#023819', 2) + '<span style="margin-left:8px">Add address</span></button>';
  } else if (k === 'help') {
    body = '<div class="card" style="padding:16px;display:flex;align-items:center;gap:12px"><span class="avatar" style="width:44px;height:44px;border-radius:50%;font-size:15px">GO</span>' +
      '<div style="flex:1;min-width:0"><div class="muted" style="font-size:12.5px">Your account manager</div><div style="font-weight:600;color:#023819">Gift Osaremen</div><div class="muted" style="font-size:12.5px">gifto@oneport365.com</div></div>' +
      '<button type="button" class="icon-btn" style="background:#023819" aria-label="Call Gift Osaremen" data-act="toast" data-v="Calling Gift Osaremen…">' + svg(P.phone, 19, '#BFFB4F', 2) + '</button></div>' +
      '<h2 class="sec" style="margin:8px 0 0">Common questions</h2><div>' + FAQ.map(function (f) {
        return '<details><summary>' + f[0] + svg(P.down, 18, '#023819', 2) + '</summary><p class="muted" style="margin:0 0 14px;font-size:13.5px;line-height:1.6">' + f[1] + '</p></details>';
      }).join('') + '</div>';
  }
  return '<section class="screen" aria-label="' + PAGES[k][0] + '">' + backBar(PAGES[k][0]) +
    '<div class="scroll" data-scroll><div style="padding:4px 20px 24px;display:flex;flex-direction:column;gap:14px">' + body + '</div></div></section>';
}

/* ================= shell ================= */
function backBar(title) {
  return '<header class="bar"><button class="icon-btn" type="button" aria-label="Back" data-act="back">' + svg(P.back, 22, '#023819', 2.2) + '</button>' +
    '<span style="font-size:14px;font-weight:500" class="muted">' + esc(title) + '</span></header>';
}
function filters(items, cur, key) {
  return '<div class="filters" role="tablist">' + items.map(function (f) {
    var on = cur === f[0];
    return '<button type="button" role="tab" aria-selected="' + on + '" class="filter' + (on ? ' on' : '') + '" data-act="filter" data-k="' + key + '" data-v="' + f[0] + '">' + f[1] + '</button>';
  }).join('') + '</div>';
}
function tabbar() {
  var pc = pendingCount();
  var items = [['home', 'Home', P.home], ['quotes', 'Quotes', P.doc], ['shipments', 'Shipments', P.box], ['account', 'Account', P.user]];
  return '<nav class="tabbar" aria-label="Main">' + items.map(function (it) {
    var on = S.tab === it[0];
    return '<button type="button" class="tab' + (on ? ' on' : '') + '"' + (on ? ' aria-current="page"' : '') + ' data-act="goTab" data-v="' + it[0] + '"><span class="ic">' + svg(it[2], 20, on ? '#023819' : '#5f665b', on ? 2 : 1.9) + '</span>' + it[1] +
      (it[0] === 'quotes' && pc ? '<span class="count" aria-label="' + pc + ' pending">' + pc + '</span>' : '') + '</button>';
  }).join('') + '</nav>';
}
function keyOf() { return S.view ? S.view + ':' + (S.view === 'ship' ? S.shipId : S.view === 'page' ? S.page : S.sel) : 'tab:' + S.tab + ':' + S.qFilter + ':' + S.sFilter; }
var lastKey = null;
function render() {
  var sc = app.querySelector('[data-scroll]'); if (sc && lastKey) memo[lastKey] = sc.scrollTop;
  var h;
  if (S.view === 'quote') h = quoteDetail() + (S.sheet === 'accept' ? acceptSheet() : S.sheet === 'reject' ? rejectSheet() : '');
  else if (S.view === 'accepted' || S.view === 'rejected') h = doneScreen(S.view);
  else if (S.view === 'ship') h = shipDetail() + (S.sheet === 'upload' ? uploadSheet() : '');
  else if (S.view === 'page') h = accountPage();
  else h = '<section class="screen">' + ({ home: homeTab, quotes: quotesTab, shipments: shipmentsTab, account: accountTab })[S.tab]() + tabbar() + '</section>' + (S.sheet === 'company' || S.sheet === 'contact' ? editSheet(S.sheet) : '');
  app.innerHTML = h;
  var key = keyOf(), nsc = app.querySelector('[data-scroll]');
  if (nsc) nsc.scrollTop = memo[key] || 0;
  lastKey = key;
  if (S.sheet === 'reject') {
    syncReject();
    if (lastSheet !== 'reject') setTimeout(function () { var t = document.getElementById('reason'); if (t) t.focus(); }, 300);
  }
  if (S.sheet === 'accept' && lastSheet !== 'accept') setTimeout(function () { var b = app.querySelector('[data-act="confirmAccept"]'); if (b) b.focus({ preventScroll: true }); }, 300);
  if ((S.sheet === 'company' || S.sheet === 'contact') && lastSheet !== S.sheet) setTimeout(function () { var f = app.querySelector('.inp'); if (f) f.focus(); }, 300);
  lastSheet = S.sheet;
}

var toastEl = document.getElementById('toast'), tt;
function toast(msg) {
  toastEl.innerHTML = svg(P.check, 16, '#BFFB4F', 2.6) + '<span>' + esc(msg) + '</span>';
  toastEl.style.bottom = S.view ? 'calc(24px + var(--safe-b))' : '';
  toastEl.hidden = false; clearTimeout(tt); tt = setTimeout(function () { toastEl.hidden = true; }, 2800);
}

/* ================= actions ================= */
var ACT = {
  restart: function () { S = fresh(); memo = {}; toastEl.hidden = true; render(); },
  goTab: function (t, el) { var f = el && el.getAttribute('data-f'); if (f) { if (t === 'quotes') S.qFilter = f; else S.sFilter = f; } S.tab = t; S.view = null; S.sheet = null; S.from = null; render(); },
  filter: function (v, el) { S[el.getAttribute('data-k')] = v; render(); },
  back: function () {
    if (S.view === 'ship' && S.from === 'quote') { S.view = 'quote'; S.from = null; }
    else { S.view = null; S.sheet = null; }
    render();
  },
  openQuote: function (id) { S.sel = id; S.view = 'quote'; S.sheet = null; S.reason = ''; S.err = false; if (S.tab !== 'home') S.tab = 'quotes'; render(); },
  openShip: function (id) { S.from = S.view === 'quote' ? 'quote' : null; S.shipId = id; S.view = 'ship'; S.sheet = null; if (!S.from && S.tab !== 'home') S.tab = 'shipments'; render(); },
  openPage: function (k) { S.page = k; S.view = 'page'; render(); },
  pref: function (k) { S.prefs[k] = !S.prefs[k]; render(); },
  signOut: function () { toast('Sign out is disabled in this prototype'); },
  toast: function (msg) { toast(msg); },
  openUpload: function (t) { S.up = { type: t || null, file: null, note: '', tried: false }; S.sheet = 'upload'; render(); },
  upType: function (t) { S.up.type = t; render(); },
  pickFile: function () { var f = document.getElementById('filepick'); f.value = ''; f.click(); },
  sendDoc: function () {
    var u = S.up;
    if (!u.type || !u.file) { u.tried = true; render(); return; }
    var d = S.docs[S.shipId] || (S.docs[S.shipId] = { need: [], files: [] });
    d.files.unshift({ type: u.type, file: u.file.name, from: 'You', date: '10 Nov', review: true });
    d.need = d.need.filter(function (t) { return t !== u.type; });
    S.sheet = null; S.up = null; render(); toast(u.type + ' sent to OnePort');
  },
  openEdit: function (w) { S.ferr = {}; S.sheet = w; render(); },
  openAccept: function () { S.sheet = 'accept'; render(); },
  openReject: function () { S.sheet = 'reject'; S.err = false; render(); },
  close: function () { S.sheet = null; S.err = false; S.up = null; S.ferr = {}; render(); },
  confirmAccept: function () {
    var q = find(QUOTES, S.sel), sid = 'SH-' + (1060 + S.newShips.length), customs = q.svc === 'customs';
    var first = q.from;
    S.newShips.unshift({ id: sid, stage: 1, svc: q.svc, service: q.service, from: q.from, to: q.to, load: loadOf(q), cargo: 'From quote ' + q.id,
      facts: [[customs ? 'Terminal' : q.svc === 'air' ? 'Flight' : 'Vessel', 'Being confirmed'], ['Quote', q.id]], eta: 'To be confirmed',
      update: 'We’re confirming the details with your sales contact. Expect an update within 24 hours.',
      ms: customs ? [['10 Nov', 'Quote ' + q.id + ' accepted'], ['—', 'Joint examination'], ['—', 'NCS assessment'], ['—', 'Release & exit note'], ['—', q.to]]
                  : [['10 Nov', 'Quote ' + q.id + ' accepted'], ['—', first], ['—', 'Departs ' + q.from.split(',')[0]], ['—', q.to], ['—', 'Your delivery address']] });
    S.docs[sid] = { need: customs ? ['Form M', 'Bill of lading', 'Commercial invoice'] : ['Commercial invoice', 'Packing list'], files: [{ type: 'Accepted quote', file: q.id + '.pdf', from: 'OnePort', date: '10 Nov', review: false }] };
    S.st[q.id] = 'accepted'; S.dec[q.id] = { on: TODAY, reason: '', ship: sid };
    S.sheet = null; S.view = 'accepted'; render();
  },
  submitReject: function () {
    if (!S.reason.trim()) { S.err = true; syncReject(); document.getElementById('reason').focus(); return; }
    S.st[S.sel] = 'rejected'; S.dec[S.sel] = { on: TODAY, reason: S.reason.trim(), ship: null };
    S.sheet = null; S.view = 'rejected'; S.reason = ''; S.err = false; render();
  }
};
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var fn = ACT[b.getAttribute('data-act')]; if (fn) fn(b.getAttribute('data-v'), b);
});
document.getElementById('filepick').addEventListener('change', function (e) {
  var f = e.target.files && e.target.files[0]; if (!f || !S.up) return;
  var kb = f.size / 1024;
  S.up.file = { name: f.name, size: kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB' };
  render();
});
app.addEventListener('submit', function (e) {
  var form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  var which = form.getAttribute('data-form'), next = {}, errs = {};
  EDIT[which].fields.forEach(function (f) {
    var v = document.getElementById('ed-' + f[0]).value.trim(); next[f[0]] = v;
    if (f[2] && !v) errs[f[0]] = f[1] + ' is required.';
    else if (f[0] === 'email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) errs[f[0]] = 'Enter a valid email address.';
  });
  if (Object.keys(errs).length) { Object.assign(S[which], next); S.ferr = errs; render(); return; }
  Object.assign(S[which], next); S.ferr = {}; S.sheet = null; render();
  toast(which === 'company' ? 'Company details updated' : 'Contact details updated');
});
app.addEventListener('input', function (e) {
  if (e.target.id === 'upnote' && S.up) { S.up.note = e.target.value; return; }
  if (e.target.id !== 'reason') return;
  S.reason = e.target.value.slice(0, 500);
  if (S.err && S.reason.trim()) S.err = false;
  syncReject();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) ACT.close(); });

render();
})();
</script>
</body>
</html>
